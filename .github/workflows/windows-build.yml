name: OStrands 0.8.0 P+ Creature Hybrid — Windows build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
      VCPKG_DISABLE_METRICS: 1
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 5G

    steps:
      - name: Check out hybrid project
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 00c5775211f45cd08b37fce0484b4cb940e422ab
          path: vcpkg
          fetch-depth: 1

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Create and verify vcpkg binary cache directory
        shell: pwsh
        run: |
          $cache = $env:VCPKG_DEFAULT_BINARY_CACHE
          if ([string]::IsNullOrWhiteSpace($cache)) {
            throw 'VCPKG_DEFAULT_BINARY_CACHE is empty.'
          }
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          if (-not (Test-Path -LiteralPath $cache -PathType Container)) {
            throw "vcpkg binary cache directory was not created: $cache"
          }
          Write-Host "VCPKG_DEFAULT_BINARY_CACHE=$cache"

      - name: Check out CommonLibSSE-NG v12.1.0
        uses: actions/checkout@v4
        with:
          repository: alandtse/CommonLibSSE-NG
          ref: v12.1.0
          path: extern/CommonLibSSE-NG
          fetch-depth: 1

      - name: Set up Python and Ninja
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and verify Ninja
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ninja
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $ninja = Join-Path $scripts 'ninja.exe'
          if (-not (Test-Path -LiteralPath $ninja -PathType Leaf)) {
            throw "ninja.exe was not found at: $ninja"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scripts
          & $ninja --version

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Run hybrid source audit
        shell: pwsh
        run: python tools/audit_hybrid_source.py

      - name: Compile DLL
        shell: cmd
        run: call build.cmd

      - name: Stage one MO2-ready artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\release\0_OStrands.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "DLL output missing: $dll"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          $dest = Join-Path $stage 'SKSE\Plugins'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $dest '0_OStrands.dll')

          $files = @(Get-ChildItem -LiteralPath $stage -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne '0_OStrands.dll') {
            throw "Expected exactly one staged file (0_OStrands.dll), found $($files.Count)."
          }
          Get-ChildItem -LiteralPath $stage -File -Recurse | Select-Object FullName, Length

      - name: Show compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload the single MO2-installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OStrands-0.8.0-Creature-PPlus-Hybrid-MO2
          path: artifact/**
          if-no-files-found: error
          retention-days: 14
